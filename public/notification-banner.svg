<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="320" fill="url(#bg)" rx="0"/>

  <!-- Decorative circles -->
  <circle cx="560" cy="80" r="180" fill="#6366F1" opacity="0.3"/>
  <circle cx="600" cy="280" r="120" fill="#8B5CF6" opacity="0.25"/>
  <circle cx="100" cy="280" r="80" fill="#A78BFA" opacity="0.2"/>

  <!-- Accent line -->
  <rect x="0" y="0" width="640" height="4" fill="url(#accent)"/>

  <!-- Bell icon -->
  <g transform="translate(80, 100)" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
  </g>

  <!-- Text -->
  <text x="140" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" letter-spacing="1">新线索通知</text>
  <text x="140" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#C7D2FE" letter-spacing="0.5">New Lead Notification</text>

  <!-- Divider -->
  <line x1="80" y1="185" x2="560" y2="185" stroke="#6366F1" stroke-width="1" opacity="0.5"/>

  <!-- Hint text -->
  <text x="80" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#A5B4FC" opacity="0.8">点击卡片查看线索详情，及时跟进客户咨询</text>

  <!-- Small dots pattern -->
  <g fill="#A78BFA" opacity="0.15">
    <circle cx="460" cy="220" r="2"/>
    <circle cx="480" cy="240" r="2"/>
    <circle cx="500" cy="215" r="2"/>
    <circle cx="440" cy="245" r="2"/>
    <circle cx="520" cy="230" r="2"/>
    <circle cx="540" cy="250" r="2"/>
  </g>
</svg>
